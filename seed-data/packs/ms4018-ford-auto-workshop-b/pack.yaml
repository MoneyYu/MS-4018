  Admin: {upn: 'admin@moneyyu.com', displayName: Tenant Admin}
  Sponsor: {upn: 'MeganB@moneyyu.com', displayName: Megan Bowen}
  Planner: {upn: 'AdeleV@moneyyu.com', displayName: Adele Vance}
  Sales: {upn: 'NestorW@moneyyu.com', displayName: Nestor Wilke}
  Supply: {upn: 'AlexW@moneyyu.com', displayName: Alex Wilber}
  Quality: {upn: 'DebraB@moneyyu.com', displayName: Debra Berger}
  Operations: {upn: 'GradyA@moneyyu.com', displayName: Grady Archie}
  Engineering: {upn: 'AllanD@moneyyu.com', displayName: Allan Deyoung}
  Analytics: {upn: 'DiegoS@moneyyu.com', displayName: Diego Siciliani}
teams:
  channels:
    - channelName: 新车上市
      channelDescription: 2026 Q3 电动车上市、销售追踪与 Q4 行动
      messages:
        - fromRole: Planner
          dayOffset: -19
          time: "09:30"
          bodyHtml: '<p>【Q3复盘】Mach-E 7月280辆、8月300辆、9月截至28日累计280辆，Q3截至28日共860辆，比960辆目标少100辆。请各位从库存与供应两侧找原因。<at id="0">Nestor Wilke</at> 请提供经销商分布。</p>'
          mentions: [Sales]
          replies:
            - fromRole: Sales
              dayOffset: -19
              time: "10:15"
              bodyHtml: '<p>收到。上海一店现车240辆，月销仅30辆，库存天数240天；北京一店120辆、月销60辆，仅60天。问题是区域配置，不是总量不足。</p>'
              mentions: []
        - fromRole: Sponsor
          dayOffset: -2
          time: "16:00"
          bodyHtml: '<p>Q4行动原则：先调拨库存、再讨论新增促销。9月29日请提交各团队一页结论，数字必须与 Excel 原始表核对。不得把内部模拟数据描述为福特官方业绩。</p>'
          mentions: []
          replies:
            - fromRole: Planner
              dayOffset: -2
              time: "16:25"
              bodyHtml: '<p>同意。复盘将分别标注“模拟数据”，并把上市、库存、供应、售后和工厂五条线放在同一张行动清单中。</p>'
              mentions: []
    - channelName: 经销商与库存
      channelDescription: 区域销量、库存天数与调拨决策
      messages:
        - fromRole: Sales
          dayOffset: -16
          time: "11:00"
          bodyHtml: '<p>库存日报：上海一店现车240辆、月销30辆（240天）；北京一店120辆、月销60辆（60天）；广州一店80辆、月销40辆（60天）。建议上海先向北京调拨40辆，暂缓追加采购。</p>'
          mentions: []
          replies:
            - fromRole: Planner
              dayOffset: -16
              time: "11:30"
              bodyHtml: '<p>请先核对跨区域物流成本与车型配置。40辆调拨是待审批建议，不是已完成动作。</p>'
              mentions: []
        - fromRole: Sales
          dayOffset: -1
          time: "14:10"
          bodyHtml: '<p>复盘表已准备：上海库存天数异常仍为240天；北京与广州各60天。Q4建议调拨40辆，负责人 Nestor，审批人 Megan，截止10月2日。</p>'
          mentions: []
          replies: []
    - channelName: 供应链与品质
      channelDescription: 电控交期、B-0921 批次品质调查
      messages:
        - fromRole: Supply
          dayOffset: -13
          time: "09:20"
          bodyHtml: '<p>【风险预警】9月电控计划到货1800件，实际按期1470件，缺口330件；请工厂先用现有安全库存排产，不能将缺口误报为召回数量。</p>'
          mentions: []
          replies:
            - fromRole: Operations
              dayOffset: -13
              time: "09:45"
              bodyHtml: '<p>苏州工厂会评估安全库存；请 Alex 9月26日前提供补货日期，缺口330件与 B-0921 品质问题分开追踪。</p>'
              mentions: []
        - fromRole: Quality
          dayOffset: -8
          time: "13:00"
          bodyHtml: '<p>电池组件 B-0921 抽检600件发现36件异常，缺陷率6%；仍为内部调查，尚未确认车辆召回。<at id="0">Allan Deyoung</at> 请在9月30日前完成根因分析。</p>'
          mentions: [Engineering]
          replies:
            - fromRole: Engineering
              dayOffset: -8
              time: "14:05"
              bodyHtml: '<p>根因尚未确认。先隔离 B-0921 未出库批次，再核对供应商制程与入厂检测记录；禁止对外称“已召回”。</p>'
              mentions: []
    - channelName: 售后与客户体验
      channelDescription: NPS、客诉分类与待确认行动
      messages:
        - fromRole: Analytics
          dayOffset: -6
          time: "10:00"
          bodyHtml: '<p>模拟售后调研各区域样本量均100：西区推荐者62、贬损者31，NPS=31；东区70、16，NPS=54。西区落后东区23分，先核对交付体验与维修等待时间。</p>'
          mentions: []
          replies:
            - fromRole: Sales
              dayOffset: -6
              time: "10:25"
              bodyHtml: '<p>西区反馈包含备件等待，但目前只是相关线索，不等于缺口330件直接导致 NPS 下降。请售后提供客诉原文后再判断。</p>'
              mentions: []
        - fromRole: Sponsor
          dayOffset: -1
          time: "15:00"
          bodyHtml: '<p>请售后团队在10月5日前复核西区 NPS=31 的100份样本，给出分渠道改进建议；复盘不可把相关性写成因果结论。</p>'
          mentions: []
          replies: []
    - channelName: 工厂运营
      channelDescription: 苏州与重庆工厂良率、瓶颈及改善措施
      messages:
        - fromRole: Operations
          dayOffset: -5
          time: "08:40"
          bodyHtml: '<p>苏州工厂本周投入1000件、合格924件，良率92.4%，低于97.5%目标5.1个百分点；重庆投入1000件、合格980件，良率98%。请区分生产良率与抽检 B-0921 的缺陷率。</p>'
          mentions: []
          replies:
            - fromRole: Quality
              dayOffset: -5
              time: "09:05"
              bodyHtml: '<p>会分开呈现：苏州全线良率92.4%与电池组件批次 B-0921 抽检缺陷率6%，基数与范围不同，不能直接相减或归因。</p>'
              mentions: []
        - fromRole: Sponsor
          dayOffset: -1
          time: "17:20"
          bodyHtml: '<p>10月3日前由 Grady 提交苏州线体改善计划，优先排查设备换线及来料检验；先拿到工程与品质联合证据，再决定资源投入。</p>'
          mentions: []
          replies: []
emails:
  emailThreads:
    - threadName: 供应链电控交期预警
      emails:
        - action: send
          fromRole: Supply
          toRoles: [Operations, Sponsor]
          ccRoles: [Admin]
          subject: '【MS-4018 20260929 WorkshopB】电控交期缺口330件：Q4排产预警'
          bodyHtml: '<p>各位好，9月计划到货1800件、按期1470件，缺口330件。请 Grady 核对安全库存、Megan 确认是否需要临时替代供应。此为模拟业务数据。</p>'
        - action: reply
          fromRole: Operations
          toRoles: [Supply, Sponsor]
          ccRoles: [Admin]
          subject: 'Re: 【MS-4018 20260929 WorkshopB】电控交期缺口330件：Q4排产预警'
          bodyHtml: '<p>已收到。苏州线先用安全库存排产，10月2日前给出产能影响评估；330件是交期缺口，不是已发生的召回。</p>'
    - threadName: B-0921 品质问题升级
      emails:
        - action: send
          fromRole: Quality
          toRoles: [Engineering, Sponsor]
          ccRoles: [Admin]
          subject: '【MS-4018 20260929 WorkshopB】B-0921 抽检异常：请先隔离批次'
          bodyHtml: '<p>B-0921 电池组件抽检600件有36件异常，缺陷率6%。根因尚未确认，请先隔离未出库批次，不对外宣称召回。Allan 请在9月30日前回报分析。</p>'
        - action: reply
          fromRole: Engineering
          toRoles: [Quality, Sponsor]
          ccRoles: [Admin]
          subject: 'Re: 【MS-4018 20260929 WorkshopB】B-0921 抽检异常：请先隔离批次'
          bodyHtml: '<p>正在比对供应商制程与入厂检测记录；会在9月30日前提交证据和处置建议。现在尚不能判断是否需要车辆召回。</p>'
    - threadName: 经销商库存调拨审批
      emails:
        - action: send
          fromRole: Sales
          toRoles: [Planner, Sponsor]
          ccRoles: [Admin]
          subject: '【MS-4018 20260929 WorkshopB】上海一店库存240天：申请调拨40辆'
          bodyHtml: '<p>上海一店现车240辆、月销30辆，库存240天；北京一店120辆、月销60辆，库存60天。建议调拨40辆到北京；请先核实车型配置与运输成本。</p>'
        - action: reply
          fromRole: Planner
          toRoles: [Sales, Sponsor]
          ccRoles: [Admin]
          subject: 'Re: 【MS-4018 20260929 WorkshopB】上海一店库存240天：申请调拨40辆'
          bodyHtml: '<p>建议合理，但尚未批准。请 Nestor 在10月2日前提交车型及运费明细给 Megan 审批，复盘中标为“待审批”。</p>'
    - threadName: 西区 NPS 下降调查
      emails:
        - action: send
          fromRole: Analytics
          toRoles: [Sales, Sponsor]
          ccRoles: [Admin]
          subject: '【MS-4018 20260929 WorkshopB】西区 NPS=31：需核查售后反馈'
          bodyHtml: '<p>西区100份问卷：推荐者62、贬损者31，NPS=31；东区100份问卷：推荐者70、贬损者16，NPS=54，相差23分。备件等待仅是假设，不可当作已证实根因。</p>'
        - action: reply
          fromRole: Sales
          toRoles: [Analytics, Sponsor]
          ccRoles: [Admin]
          subject: 'Re: 【MS-4018 20260929 WorkshopB】西区 NPS=31：需核查售后反馈'
          bodyHtml: '<p>已安排售后团队抽样复核，10月5日前给出反馈分类和改进建议；目前不把交期缺口330件与 NPS 差距直接画等号。</p>'
    - threadName: Q3 经营复盘材料请求
      emails:
        - action: send
          fromRole: Sponsor
          toRoles: [Planner, Sales, Supply, Quality, Operations, Analytics]
          ccRoles: [Admin]
          subject: '【MS-4018 20260929 WorkshopB】请汇总Q3经营复盘及Q4行动'
          bodyHtml: '<p>请各团队核对同一批模拟数据：Mach-E Q3销量860辆/目标960辆；上海库存240天、调拨40辆待审批；电控缺口330件；B-0921 缺陷6%仍在调查；西区 NPS=31；苏州良率92.4%。9月29日提交要点，未确认事项单独标注。</p>'
        - action: reply
          fromRole: Planner
          toRoles: [Sponsor, Sales, Supply, Quality, Operations, Analytics]
          ccRoles: [Admin]
          subject: 'Re: 【MS-4018 20260929 WorkshopB】请汇总Q3经营复盘及Q4行动'
          bodyHtml: '<p>收到。我会先用 Excel 工作表核对数字，再以 Teams channel 决策和邮件回复更新行动清单；不将模拟数据当成真实公开业绩。</p>'
workbooks:
  - filename: 新车销售追踪.xlsx
    sheets:
      - name: 季度销量
        table: EvQuarterSales
        headers: [月份, 车型, 实际销量, 目标销量, 差额]
        rows:
          - [2026-07, Mach-E, 280, 320, null]
          - [2026-08, Mach-E, 300, 320, null]
          - [2026-09, Mach-E, 280, 320, null]
        formulas: {差额: '=C{row}-D{row}'}
        chart: {category: 月份, value: 实际销量}
      - name: 区域明细
        table: EvRegionSales
        headers: [月份, 区域, 实际销量, 目标销量, 差额]
        rows:
          - [2026-07, 华东, 80, 90, null]
          - [2026-07, 华北, 60, 70, null]
          - [2026-07, 华南, 50, 60, null]
          - [2026-07, 西南, 40, 45, null]
          - [2026-07, 华中, 30, 35, null]
          - [2026-07, 东北, 20, 20, null]
          - [2026-08, 华东, 85, 90, null]
          - [2026-08, 华北, 65, 70, null]
          - [2026-08, 华南, 55, 60, null]
          - [2026-08, 西南, 45, 45, null]
          - [2026-08, 华中, 30, 35, null]
          - [2026-08, 东北, 20, 20, null]
          - [2026-09, 华东, 70, 90, null]
          - [2026-09, 华北, 65, 70, null]
          - [2026-09, 华南, 55, 60, null]
          - [2026-09, 西南, 40, 45, null]
          - [2026-09, 华中, 30, 35, null]
          - [2026-09, 东北, 20, 20, null]
        formulas: {差额: '=C{row}-D{row}'}
  - filename: 经销商库存.xlsx
    sheets:
      - name: 区域库存
        table: DealerInventory
        headers: [经销商, 现车, 月销, 库存天数]
        rows:
          - [上海一店, 240, 30, null]
          - [北京一店, 120, 60, null]
          - [广州一店, 80, 40, null]
          - [成都一店, 75, 25, null]
          - [武汉一店, 55, 22, null]
        formulas: {库存天数: '=IF(C{row}=0,0,B{row}/C{row}*30)'}
        chart: {category: 经销商, value: 现车}
  - filename: 零部件品质追踪.xlsx
    sheets:
      - name: 到货
        table: ComponentDelivery
        headers: [月份, 零部件, 计划到货, 按期到货, 缺口]
        rows: [[2026-09, 电控, 1800, 1470, null]]
        formulas: {缺口: '=C{row}-D{row}'}
      - name: 批次抽检
        table: ComponentQuality
        headers: [批次, 类别, 抽检件数, 异常件数, 缺陷率]
        rows:
          - [B-0921, 电池组件, 600, 36, null]
          - [M-0908, 电控模块, 500, 5, null]
        formulas: {缺陷率: '=IF(C{row}=0,0,D{row}/C{row})'}
        chart: {category: 批次, value: 异常件数}
  - filename: 售后NPS.xlsx
    sheets:
      - name: 区域调研
        table: ServiceNps
        headers: [区域, 推荐者, 贬损者, 样本量, NPS]
        rows:
          - [西区, 62, 31, 100, null]
          - [东区, 70, 16, 100, null]
          - [北区, 65, 22, 100, null]
          - [南区, 67, 20, 100, null]
        formulas: {NPS: '=IF(D{row}=0,0,(B{row}-C{row})/D{row}*100)'}
        chart: {category: 区域, value: 推荐者}
  - filename: 工厂KPI.xlsx
    sheets:
      - name: 生产良率
        table: PlantYield
        headers: [工厂, 投入件数, 合格件数, 良率, 目标良率]
        rows:
          - [苏州, 1000, 924, null, 0.975]
          - [重庆, 1000, 980, null, 0.975]
          - [南京, 1000, 972, null, 0.975]
        formulas: {良率: '=IF(B{row}=0,0,C{row}/B{row})'}
        chart: {category: 工厂, value: 合格件数}
      - name: 日度示例
        table: DailyPlantSamples
        headers: [工厂, 日期, 合格件数]
        generate:
          seed: 20260929
          dimensions: [苏州, 重庆]
          periods: ['2026-09-22', '2026-09-23', '2026-09-24', '2026-09-25', '2026-09-26', '2026-09-27', '2026-09-28']
          min: 920
          max: 985
          overrides:
            - {dimension: 苏州, period: '2026-09-28', value: 924}
        chart: {category: 日期, value: 合格件数}
